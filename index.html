<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CarDeck · 升级源</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #0e1116; color: #c9cfd8;
    font: 15px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    padding: 32px;
  }
  .card {
    width: 100%; max-width: 620px; background: #161a21; border: 1px solid #232a34;
    border-radius: 14px; padding: 28px 30px 30px;
  }
  .tag { font-size: 11px; letter-spacing: 3px; color: #6c7684; text-transform: uppercase; }
  h1 { margin: 10px 0 4px; font-size: 26px; letter-spacing: 1px; color: #e6ebf2; font-weight: 600; }
  .sub { color: #7d8794; font-size: 13px; margin-bottom: 22px; }
  table { width: 100%; border-collapse: collapse; margin-bottom: 22px; }
  td { padding: 7px 0; border-bottom: 1px dashed #20262f; font-size: 13px; vertical-align: top; }
  td:first-child { color: #79828f; width: 96px; white-space: nowrap; }
  code { font-family: ui-monospace, Consolas, monospace; color: #b9c4d2; word-break: break-all; }
  a.btn {
    display: inline-block; padding: 11px 22px; border-radius: 9px; text-decoration: none;
    background: #2c6fd1; color: #fff; font-weight: 600; letter-spacing: 1px; font-size: 14px;
  }
  a.btn:hover { background: #377ce0; }
  .note { margin-top: 20px; font-size: 12px; color: #667080; line-height: 1.7; }
  .err { color: #d98a7d; }
</style>
</head>
<body>
<div class="card">
  <div class="tag">CarDeck Update Source</div>
  <h1>QS 车载中心 · 升级源</h1>
  <div class="sub">这个目录只放升级包，车机上的 App 会读同目录的 <code>cardeck.json</code>。</p></div>

  <table>
    <tr><td>版本</td><td><b id="ver">读取中…</b></td></tr>
    <tr><td>文件</td><td><code id="file">—</code></td></tr>
    <tr><td>大小</td><td id="size">—</td></tr>
    <tr><td>SHA-256</td><td><code id="sha" style="font-size:11px">—</code></td></tr>
    <tr><td>发布时间</td><td id="date">—</td></tr>
    <tr><td>说明</td><td id="note">—</td></tr>
  </table>

  <a class="btn" id="dl" href="#" download>下载最新版 APK</a>

  <div class="note">
    车机上「设置 → 应用更新 → 检查更新」会先请求本目录的 cardeck.json；<br>
    服务器不通再回落 GitHub 备用源。发布新版本用
    <code>CarDeckAndroid\publish-update.ps1</code> 生成包与清单，再把这个目录整份传到服务器。
  </div>
</div>
<script>
(function () {
  function fmt(b) { return b >= 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.round(b / 1024) + ' KB'; }
  fetch('cardeck.json?t=' + Date.now())
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (j) {
      document.getElementById('ver').textContent = 'v' + j.version;
      document.getElementById('file').textContent = j.apk;
      document.getElementById('size').textContent = fmt(j.size || 0);
      document.getElementById('sha').textContent = j.sha256 || '—';
      document.getElementById('date').textContent = j.date || '—';
      document.getElementById('note').textContent = j.note || '—';
      document.getElementById('dl').href = j.apk;
    })
    .catch(function (e) {
      document.getElementById('ver').innerHTML = '<span class="err">读不到 cardeck.json：' + e.message + '</span>';
    });
})();
</script>
</body>
</html>
